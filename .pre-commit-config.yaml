repos:
  - repo: local
    hooks:
      - id: ruff
        name: Python lint
        entry: python -m claude.scripts.check_quality lint
        exclude: '^(ryon|toby)/'
        language: system
        types: [python]
      - id: ruff-format
        name: Python format
        entry: python -m claude.scripts.check_quality format
        exclude: '^(ryon|toby)/'
        language: system
        types: [python]
      - id: artifacts
        name: Python syntax and protected challenge contracts
        entry: python -m claude.scripts.check_artifacts
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: Complete offline test suite
        entry: python -m pytest claude/tests -q
        language: system
        pass_filenames: false
        always_run: true
