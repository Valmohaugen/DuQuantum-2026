[tool.pytest.ini_options]
testpaths = ["claude/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.ipynb", "benchmark_outputs", "submission_outputs", ".mypy_cache", "ryon", "toby"]
force-exclude = true # preserve the upstream reference files verbatim; maintained code lives in claude/

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"claude/tests/test_tutorial.py" = ["E402"]
