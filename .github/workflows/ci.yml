name: Offline correctness and artifact checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    env:
      MPLBACKEND: Agg
      TUTORIAL_NO_WIDGETS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: claude/requirements.lock
      - run: python -m pip install -r claude/requirements.lock
      - run: python -m pip check
      - run: python -m ruff check solution.py claude
      - run: python -m ruff format --check solution.py claude
      - run: python -m claude.scripts.check_artifacts
      - run: python -m pytest -q
      - run: python -m claude.scripts.check_notebooks
